name: test2infeR CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        r: [release]

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: R CMD check
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          error-on: '"error"'

  # KNOWN ISSUE: this job has never passed, on any commit in this repo's
  # history. R segfaults (exit 139) the moment JuliaCall loads its setup.jl,
  # which does `using RCall`. Two earlier causes have been fixed and verified
  # from the logs -- missing libuv headers (broke fs -> pkgload -> testthat)
  # and missing Suppressor/RCall -- and the job now gets all the way to
  # engine load before dying. The remaining fault is in the R <-> RCall
  # interaction on the Ubuntu runner and has NOT been diagnosed; commit
  # 958d4f3 ("Add RCall pre-install step to avoid Ubuntu segfault") was an
  # earlier attempt at the same thing that also did not work.
  #
  # The e2e script itself runs correctly on a normal machine. Run it by hand:
  #   Rscript inst/scripts/e2e_synthetic_panel_analysis.R <outdir>
  #
  # Do not assume a green badge here means the engine is untested -- the three
  # `check` jobs above pass, and they exercise everything except Julia.
  e2e:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      # `fs` (via pkgload -> testthat) needs libuv headers, and RCall.jl needs
      # the R shared library. Without these the dependency install fails before
      # anything is tested.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install R dependencies
        run: |
          Rscript -e 'install.packages(c("remotes","ggplot2","JuliaCall"), repos="https://cloud.r-project.org")'

      - name: Cache Julia depot
        uses: actions/cache@v4
        with:
          path: ~/.julia
          key: ${{ runner.os }}-julia-${{ hashFiles('inst/julia/Project.toml', 'inst/julia/Manifest.toml') }}
          restore-keys: |
            ${{ runner.os }}-julia-

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'

      # JuliaCall's own setup.jl does `using Suppressor` and `using RCall`, so
      # both must exist in the default depot before setup_hmm_engine() runs.
      # This is separate from the engine's own pinned project.
      #
      # NOTE: this is necessary but NOT sufficient -- see the KNOWN ISSUE on the
      # job below. Both packages precompile and load fine in a standalone Julia
      # process here; R still segfaults when it loads them through JuliaCall.
      - name: Install and precompile Julia packages JuliaCall requires
        run: |
          export R_HOME=$(R RHOME)
          julia -e 'using Pkg; Pkg.add(["Suppressor", "RCall"]); Pkg.precompile()'
          julia -e 'using RCall; using Suppressor; println("RCall + Suppressor loaded successfully")'

      - name: Fresh-library install of this commit and run e2e script
        run: |
          mkdir -p e2e_out
          Rscript -e '
            options(repos = c(CRAN = "https://cloud.r-project.org"));
            lib <- tempfile("lib_"); dir.create(lib, recursive = TRUE);
            .libPaths(c(lib, .libPaths()));
            remotes::install_local(".", upgrade = "never", dependencies = TRUE, lib = lib);
            library(test2infeR, lib.loc = lib);
            setup_hmm_engine(install_julia = FALSE);
            source("inst/scripts/e2e_synthetic_panel_analysis.R");
          ' e2e_out

      - name: Assert artifacts exist and are non-trivial
        run: |
          test -s e2e_out/synthetic_prevalence.png
          test -s e2e_out/synthetic_corner.png
          for f in e2e_out/synthetic_prevalence.png e2e_out/synthetic_corner.png; do
            size=$(stat -c%s "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 20000 ]; then
              echo "::error::$f is suspiciously small ($size bytes)"
              exit 1
            fi
          done

      - name: Upload e2e artifacts
        uses: actions/upload-artifact@v4
        with:
          name: e2e-figures
          path: e2e_out/*.png
